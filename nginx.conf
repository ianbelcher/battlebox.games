user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Logs go to the container's stdout/stderr so `docker compose logs`
    # is the whole story; a file inside the container would be invisible.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # The browser build is ~60 MB of wasm and pack file. Compressing it on
    # the way out roughly quarters the wasm, which is the difference
    # between a tolerable first load and a child wandering off.
    #
    # This is the ONLY thing that compresses: the TLS terminator in front
    # passes an already-encoded body straight through, and re-compressing
    # would cost CPU for nothing.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 4096;
    gzip_proxied any;
    gzip_vary on;
    # text/html is always gzipped and naming it again is a warning.
    gzip_types application/wasm application/javascript text/css
               application/octet-stream image/svg+xml;

    client_max_body_size 1m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # -------------------------------------------------------------------
    # Everything is served here, on plain http, on one port.
    #
    # This container is NEVER exposed to the internet directly. A TLS
    # terminator sits in front of it holding the real certificate, and
    # a CDN may sit in front of
    # that. The browser therefore sees https, which is what actually
    # matters — see the Cross-Origin-* note below.
    # -------------------------------------------------------------------
    server {
        listen 8081;
        root /opt/battlebox/web;
        index index.html;

        # REDIRECTS MUST BE RELATIVE. nginx builds an absolute Location out
        # of the Host and ITS OWN listen port by default, so /play/ sent
        # browsers to http://battlebox.games:8081/ — the internal port, over
        # plain http, through a terminator that is the only reason the game
        # works at all. A relative Location is resolved by the browser
        # against the address it actually used.
        absolute_redirect off;

        # What the deploy script polls after `docker compose up` to decide
        # whether the new image really came up, rather than assuming it.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # THE GAME IS THE FRONT DOOR. The site loads the game; there is
        # no page in front of it to read first and nothing to download.
        #
        # Old links land where they always did: /play/ was the game's home
        # for its whole life so far and is bookmarked, printed in the
        # README, and in every message anybody has sent about it.
        location = /play { return 301 /; }
        location /play/ { return 301 /; }

        # The optional loading-screen video, and the reason it needs its
        # own block: the catch-all below falls back to /index.html, so a
        # MISSING demo.mp4 answered 200 with the game's HTML in it and the
        # <video> element sat there trying to decode a web page. It 404s
        # now, which is what boot.js is written to expect.
        #
        # The CORP header is repeated rather than inherited — nginx's
        # add_header does not merge, and under the page's require-corp
        # policy a subresource without it is simply blocked.
        location = /demo.mp4 {
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # The game itself, at the root.
        #
        # The two Cross-Origin-* headers are what make the page "cross-origin
        # isolated", which is the only state in which a browser hands out
        # SharedArrayBuffer. Godot's threaded build meshes voxel chunks on
        # real threads and needs it: without these headers the game
        # downloads in full and then dies on startup.
        #
        # They only count in a secure context, which is why the terminator
        # in front is load-bearing rather than decoration. Reaching this
        # container over plain http (a LAN test, a port-forward) gets you a
        # game that loads and then fails — that is expected, not a bug.
        location / {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            # Stable filenames, new content every deploy. A cached wasm
            # against a new pack file fails in ways nobody could diagnose.
            # This also serves /version.txt, which the deploy check reads
            # to prove the build it just pushed is the one answering.
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        # The game server, same origin as the page.
        #
        # Same origin is not tidiness. A page served over https cannot open
        # a plain ws:// socket at all (mixed content, blocked silently), and
        # the game server speaks plain WebSocket — so the only way a browser
        # can reach it is through a terminator, on the page's own origin.
        # The server container shares this container's network namespace,
        # so this is a loopback hop.
        # The lobby's JSON API: which games are running, and start one.
        # Same origin as the page, so the browser build needs no CORS and
        # no second address to get wrong.
        location /api/ {
            proxy_pass http://127.0.0.1:9080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Which games are running changes by the second; a cached list
            # would offer people games that have already finished.
            add_header Cache-Control "no-store" always;
        }

        location /ws {
            # To the LOBBY, not to a world. It reads ?room=<code> and
            # splices this socket onto that room's own port. One location
            # covers every game there will ever be, which is why the room
            # travels as a query parameter rather than a path segment.
            proxy_pass http://127.0.0.1:9080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Chunk bursts on join are large and latency matters more than
            # throughput here; let them straight through.
            proxy_buffering off;
            # A game can be up for an afternoon with quiet spells in it.
            # The default 60s read timeout would drop the socket mid-play.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

    }
}
