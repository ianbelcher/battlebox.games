# Run BattleBox yourself.
#
#     BATTLEBOX_IMAGE=ghcr.io/ianbelcher/battlebox.games:latest \
#       docker compose -f deploy/docker-compose.yml up -d
#
# Two containers and no state worth the name:
#
#   lobby  the room registry. Starts one headless world PER GAME, each
#          holding its blocks and players in memory, and proxies /ws to
#          whichever one was asked for.
#   web    nginx, serving the browser build and relaying /ws and /api to
#          the lobby.
#
# Nothing is written to disk, so there is no volume and nothing to back up.
# A restart is a clean table by construction.
#
# THERE IS NO TLS HERE, and the game needs it. The browser build meshes
# chunks on real threads, which needs SharedArrayBuffer, which browsers
# only hand to a cross-origin isolated page — and isolation only counts in
# a secure context. Over plain http the game loads and then dies.
#
# So put a terminator in front of this on 8081: Caddy, Traefik, nginx, a
# tunnel, whatever you already run. It must pass websocket upgrades through
# and leave response headers alone, or the Cross-Origin-* headers nginx.conf
# sets never reach the browser.

name: battlebox

services:
  lobby:
    image: ${BATTLEBOX_IMAGE:?set BATTLEBOX_IMAGE}
    command: ["lobby"]
    restart: unless-stopped
    environment:
      # The whole of what a fresh world is, until somebody changes the map
      # from the in-game menu.
      WORLD_SOURCE: procedural
      # Each room is a process holding its own world in memory, so this is
      # the real cap on how much of the machine the game can use. Eight
      # 250-block worlds is comfortable in 4 GB.
      LOBBY_MAX_ROOMS: "8"
      # A created game closes itself this long after the last player
      # leaves: long enough to survive a reconnect, short enough that an
      # abandoned game is not still holding a slot hours later.
      LOBBY_IDLE_EXIT: "90"
    # Loopback only. A page served over plain http is not a secure context,
    # so the browser build would load and then die there — this is for a
    # health check and a hands-on look, not for players.
    ports:
      - "127.0.0.1:8081:8081"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${BATTLEBOX_IMAGE:?set BATTLEBOX_IMAGE}
    command: ["web"]
    restart: unless-stopped
    # Shares the lobby's network namespace, which is why nginx.conf can say
    # `proxy_pass http://127.0.0.1:9080` and mean it — and why the lobby
    # can reach each room on 127.0.0.1 too.
    #
    # The consequence: recreating `lobby` tears down the namespace `web` is
    # living in, so bring the stack up together rather than restarting one.
    network_mode: "service:lobby"
    depends_on:
      - lobby
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
